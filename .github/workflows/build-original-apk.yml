name: Build original AndroLua Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-original-apk.yml'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and capture log
        shell: bash
        run: |
          mkdir -p ci-output native-libs
          set +e
          {
            echo "=== Environment ==="
            java -version

            SDK_ROOT="$RUNNER_TEMP/android-sdk"
            NDK_ROOT="$RUNNER_TEMP/android-ndk-r17c"
            rm -rf "$SDK_ROOT" "$NDK_ROOT" "$RUNNER_TEMP/platform-unpack" "$RUNNER_TEMP/buildtools-unpack"
            mkdir -p "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" "$RUNNER_TEMP/platform-unpack" "$RUNNER_TEMP/buildtools-unpack"

            echo "=== Download Android Platform 28 ==="
            curl -L --fail --retry 3 -o "$RUNNER_TEMP/platform-28_r06.zip" https://dl.google.com/android/repository/platform-28_r06.zip
            PLATFORM_STATUS=$?
            if [ "$PLATFORM_STATUS" -eq 0 ]; then
              unzip -q "$RUNNER_TEMP/platform-28_r06.zip" -d "$RUNNER_TEMP/platform-unpack"
              mv "$RUNNER_TEMP/platform-unpack/android-9" "$SDK_ROOT/platforms/android-28"
            fi
            echo "platform_status=$PLATFORM_STATUS"

            echo "=== Download Build Tools 28.0.3 ==="
            curl -L --fail --retry 3 -o "$RUNNER_TEMP/build-tools_r28.0.3-linux.zip" https://dl.google.com/android/repository/build-tools_r28.0.3-linux.zip
            BUILDTOOLS_STATUS=$?
            if [ "$BUILDTOOLS_STATUS" -eq 0 ]; then
              unzip -q "$RUNNER_TEMP/build-tools_r28.0.3-linux.zip" -d "$RUNNER_TEMP/buildtools-unpack"
              mv "$RUNNER_TEMP/buildtools-unpack/android-9" "$SDK_ROOT/build-tools/28.0.3"
              chmod +x "$SDK_ROOT/build-tools/28.0.3"/* 2>/dev/null || true
            fi
            echo "buildtools_status=$BUILDTOOLS_STATUS"

            echo "=== Download NDK r17c ==="
            curl -L --fail --retry 3 -o "$RUNNER_TEMP/android-ndk-r17c-linux-x86_64.zip" https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
            NDK_STATUS=$?
            if [ "$NDK_STATUS" -eq 0 ]; then
              unzip -q "$RUNNER_TEMP/android-ndk-r17c-linux-x86_64.zip" -d "$RUNNER_TEMP"
            fi
            echo "ndk_status=$NDK_STATUS"

            export ANDROID_HOME="$SDK_ROOT"
            export ANDROID_SDK_ROOT="$SDK_ROOT"
            export ANDROID_NDK_HOME="$NDK_ROOT"
            export ANDROID_NDK_ROOT="$NDK_ROOT"
            printf 'sdk.dir=%s\nndk.dir=%s\n' "$SDK_ROOT" "$NDK_ROOT" > local.properties

            SDK_STATUS=0
            [ "$PLATFORM_STATUS" -eq 0 ] || SDK_STATUS=1
            [ "$BUILDTOOLS_STATUS" -eq 0 ] || SDK_STATUS=1
            [ "$NDK_STATUS" -eq 0 ] || SDK_STATUS=1
            [ -f "$SDK_ROOT/platforms/android-28/android.jar" ] || SDK_STATUS=1
            [ -x "$SDK_ROOT/build-tools/28.0.3/aapt" ] || SDK_STATUS=1
            [ -x "$NDK_ROOT/ndk-build" ] || SDK_STATUS=1
            echo "sdk_status=$SDK_STATUS"

            echo "=== Install Gradle 4.6 ==="
            curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle-4.6-bin.zip" https://services.gradle.org/distributions/gradle-4.6-bin.zip
            CURL_STATUS=$?
            echo "gradle_download_status=$CURL_STATUS"
            if [ "$CURL_STATUS" -eq 0 ]; then
              rm -rf "$RUNNER_TEMP/gradle-4.6"
              unzip -q "$RUNNER_TEMP/gradle-4.6-bin.zip" -d "$RUNNER_TEMP"
              export PATH="$RUNNER_TEMP/gradle-4.6/bin:$PATH"
              gradle --version
            fi

            BUILD_STATUS=99
            if [ "$SDK_STATUS" -eq 0 ] && [ "$CURL_STATUS" -eq 0 ]; then
              echo "=== Build debug APK ==="
              gradle --no-daemon --stacktrace :app:assembleDebug
              BUILD_STATUS=$?
            fi
            echo "build_status=$BUILD_STATUS"

            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "=== Extract native libraries ==="
              unzip -q app/build/outputs/apk/debug/app-debug.apk 'lib/*' -d native-libs || true
              find native-libs -type f -maxdepth 4 -print || true
              ls -lh app/build/outputs/apk/debug/app-debug.apk
            fi
          } 2>&1 | tee ci-output/build.log

          SDK_STATUS=$(grep -E '^sdk_status=' ci-output/build.log | tail -1 | cut -d= -f2)
          BUILD_STATUS=$(grep -E '^build_status=' ci-output/build.log | tail -1 | cut -d= -f2)
          echo "sdk_status=${SDK_STATUS:-unknown}" > ci-output/latest.txt
          echo "build_status=${BUILD_STATUS:-unknown}" >> ci-output/latest.txt
          echo "run_id=${GITHUB_RUN_ID}" >> ci-output/latest.txt
          echo "run_number=${GITHUB_RUN_NUMBER}" >> ci-output/latest.txt
          echo "commit=${GITHUB_SHA}" >> ci-output/latest.txt
          exit 0

      - name: Upload APK and native libraries
        id: upload
        if: ${{ hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: androlua-original-build
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            native-libs/**

      - name: Record artifact metadata and log
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "artifact_id=${{ steps.upload.outputs.artifact-id }}" >> ci-output/latest.txt
          echo "artifact_url=${{ steps.upload.outputs.artifact-url }}" >> ci-output/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/latest.txt ci-output/build.log
          git commit -m "Record latest AndroLua CI build result" || exit 0
          git pull --rebase origin master || true
          git push origin HEAD:master
