name: Build original AndroLua Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-original-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Android SDK 28, Build Tools 28.0.3 and NDK r17c
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "ndk;17.2.4988734"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/17.2.4988734" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/17.2.4988734" >> "$GITHUB_ENV"

      - name: Install Gradle 4.6
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle-4.6-bin.zip https://services.gradle.org/distributions/gradle-4.6-bin.zip
          unzip -q /tmp/gradle-4.6-bin.zip -d /tmp
          echo "/tmp/gradle-4.6/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Extract native libraries
        shell: bash
        run: |
          rm -rf native-libs
          mkdir -p native-libs
          unzip -q app/build/outputs/apk/debug/app-debug.apk 'lib/*' -d native-libs || true
          find native-libs -type f -maxdepth 4 -print || true

      - name: Upload APK and native libraries
        uses: actions/upload-artifact@v4
        with:
          name: androlua-original-build
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            native-libs/**
